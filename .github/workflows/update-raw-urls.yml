name: Update Raw URLs

on:
  push:
    branches: [ master ]

jobs:
  update-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate raw URLs file
        run: |
          echo "GitHub Raw File URLs:" > GitHub_file_URLs.txt
          echo "Auto-generated on push — do not edit manually" >> GitHub_file_URLs.txt
          echo "" >> GitHub_file_URLs.txt
          
          # Find all .py files and .md files, generate raw URLs
          find . -type f \( -name "*.py" -o -name "*.md" -o -name "*.txt" -o -name "*.bat" \) \
            ! -path "./.github/*" \
            ! -path "./venv/*" \
            ! -path "./__pycache__/*" \
            | sort \
            | while read filepath; do
                # Strip leading ./
                clean_path="${filepath#./}"
                echo "https://raw.githubusercontent.com/easterbrookandco-droid/options-flow-scanner/master/${clean_path}"
              done >> GitHub_file_URLs.txt

      - name: Commit updated URLs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GitHub_file_URLs.txt
          git diff --staged --quiet || git commit -m "Auto-update raw file URLs [skip ci]"
          git push
